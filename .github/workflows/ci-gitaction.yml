name: CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'frontend/**'

permissions:
  contents: read

jobs:
  repo-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify monorepo layout
        run: |
          test -d backend
          test -d frontend

  backend:
    runs-on: ubuntu-latest
    needs: repo-structure
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend source
        run: python -m compileall app

  frontend:
    runs-on: ubuntu-latest
    needs: repo-structure
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t kintai/backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t kintai/frontend:ci .
